name: CI

on:
  push:
  workflow_dispatch:

# Cancel an older run on the same branch when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PG_USER: postgres
  PG_PASSWORD: postgres
  PG_HOST: localhost
  PG_PORT: 5432
  PG_TEST_DATABASE: poscon_test
  SESSION_SECRET: ci-secret

jobs:
  api:
    name: API lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: server/coverage
          retention-days: 7

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: postocom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: postocom/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watchAll=false
      # CI=true makes the build fail on any warning
      - run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [api, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            postocom/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: postocom
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for the API and check the app
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/products > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:9000/products | grep -q '"total":35'
          curl -sf http://localhost:3000/ | grep -q '<div id="root">'
          curl -sf http://localhost:3000/browseproduct | grep -q '<div id="root">'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
