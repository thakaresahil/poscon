server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Send every route to index.html so React Router can handle it
  location / {
    try_files $uri /index.html;
  }

  # Built JS and CSS files have hashed names, so they can be cached for a long time
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
